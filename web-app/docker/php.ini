[PHP]
expose_php = Off
max_execution_time = 60
max_input_time = 60
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
post_max_size = 32M
default_charset = "UTF-8"
upload_max_filesize = 32M
max_file_uploads = 20
allow_url_fopen = On
variables_order = "EGPCS"

[Date]
date.timezone = Asia/Jakarta
